name: Frontend Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-build:
    name: 🧪 Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore

      - name: Build
        run: npm run build
