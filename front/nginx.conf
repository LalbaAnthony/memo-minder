# Production server for the SPA (front-prod container)
# Sits behind the host reverse proxy, which terminates TLS, and forwards /api to the back-prod container

# Cache policy by path: hashed build assets are immutable, the API is never cached,
# everything else (index.html, service worker, manifest, icons) is revalidated so PWA updates are picked up
map $uri $cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Declared once at server level: any add_header inside a location would drop all of these for that location
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS. A variable in proxy_pass forces resolution at request time,
    # so a recreated back-prod container (new IP) is picked up without restarting nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://back-prod:3000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing hashed asset must 404 instead of returning index.html with a 200
    location /assets/ {
        try_files $uri =404;
    }

    # Vue router history mode: unknown paths fall back to the SPA entry point
    location / {
        try_files $uri /index.html;
    }
}
