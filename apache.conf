# ! This Apache2 file is NOT AUTOMATICALLY GENERATED or PUSHED IN PRODUCTION AUTOMATICALLY  
# ! It is just a reference that NEEDS TO FIT THE EXACT SERVER CONFIGURATION to ensure reproductibility

<VirtualHost *:80>
    ServerName memo-minder.dev-it.app

    # Certbot webroot - serve ACME challenge files directly, never redirect
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect everything else to HTTPS. The target host is hardcoded rather than
    # carried over from %{HTTP_HOST}, so a request arriving on any other name -
    # or on the bare IP, which lands here as the default vhost - is folded onto
    # the apex instead of being served as a second origin.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://memo-minder.dev-it.app%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName memo-minder.dev-it.app

    Protocols h2 h2c http/1.1
    ProtocolsHonorOrder On

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/memo-minder.dev-it.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/memo-minder.dev-it.app/privkey.pem

    # Apache only terminates TLS. The whole app (SPA, /api proxy, cache headers, history-mode fallback)
    # is served by the front-prod Docker container, published on the loopback only.
    # The port MUST match FRONT_HOST_PORT in the production .env
    # Required modules: proxy, proxy_http, headers, ssl, rewrite, http2
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:4570/
    ProxyPassReverse / http://127.0.0.1:4570/

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/memo-minder_error.log
    CustomLog ${APACHE_LOG_DIR}/memo-minder_access.log combined
</VirtualHost>
